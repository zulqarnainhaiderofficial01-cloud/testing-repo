
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | NexaCore</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1120;
      color: #fff;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: #151e30;
      border: 1px solid #26334a;
      border-radius: 18px;
      box-shadow: 0 20px 60px #0005;
    }

    .logo {
      font-size: 25px;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 9px;
      color: white;
      outline: none;
      font-size: 14px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px #60a5fa20;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #60a5fa;
      cursor: pointer;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 25px;
      color: #94a3b8;
    }

    .remember {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .remember input {
      width: auto;
      accent-color: #3b82f6;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .signup {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: #94a3b8;
    }

    .message {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      color: #f87171;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">NexaCore.</div>

    <h1>Welcome back</h1>
    <p class="subtitle">Please enter your details to sign in.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >
          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
          >Show</button>
        </div>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember">
          Remember me
        </label>
        <a href="forget_password.html">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn">
        Sign in
      </button>

      <p class="message" id="message"></p>
    </form>

    <p class="signup">
      Don't have an account? <a href="register.html">Sign up</a>
    </p>
  </div>

  <script>
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    togglePassword.addEventListener("click", () => {
      const isHidden = password.type === "password";

      password.type = isHidden ? "text" : "password";
      togglePassword.textContent = isHidden ? "Hide" : "Show";
    });

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();

      message.style.color = "#fbbf24";
      message.textContent =
        "UI demo only. Connect a backend to authenticate users.";
    });
  </script>

</body>
</html>
