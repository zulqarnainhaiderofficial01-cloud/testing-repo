
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | NexaCore</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1120;
      color: #fff;
      padding: 30px 15px;
    }

    .register-container {
      width: 100%;
      max-width: 460px;
      padding: 38px;
      background: #151e30;
      border: 1px solid #26334a;
      border-radius: 18px;
      box-shadow: 0 20px 60px #0005;
    }

    .logo {
      font-size: 25px;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 13px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 9px;
      color: white;
      outline: none;
      font-size: 14px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px #60a5fa20;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 65px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #60a5fa;
      cursor: pointer;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 22px 0;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }

    .terms input {
      width: auto;
      margin-top: 3px;
      accent-color: #3b82f6;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .register-btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .login-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #94a3b8;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .register-container {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="register-container">

    <div class="logo">NexaCore.</div>

    <h1>Create an account</h1>
    <p class="subtitle">
      Join us today. Enter your details to get started.
    </p>

    <form id="registerForm">

      <div class="form-group">
        <label for="name">Full name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          minlength="2"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="8"
            required
          >
          <button
            type="button"
            class="toggle-password"
            data-target="password"
          >Show</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            required
          >
          <button
            type="button"
            class="toggle-password"
            data-target="confirmPassword"
          >Show</button>
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" id="terms" required>
        <span>
          I agree to the <a href="#">Terms of Service</a>
          and <a href="#">Privacy Policy</a>.
        </span>
      </label>

      <button type="submit" class="register-btn">
        Create Account
      </button>

      <p class="message" id="message"></p>

    </form>

    <p class="login-link">
      Already have an account?
      <a href="login.html">Sign in</a>
    </p>

  </div>

  <script>
    // Show / Hide Password
    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", () => {
        const field = document.getElementById(button.dataset.target);
        const isHidden = field.type === "password";

        field.type = isHidden ? "text" : "password";
        button.textContent = isHidden ? "Hide" : "Show";
      });
    });

    // Registration Form
    const registerForm = document.getElementById("registerForm");
    const message = document.getElementById("message");

    registerForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (name.length < 2) {
        showMessage("Please enter a valid name.", false);
        return;
      }

      if (password.length < 8) {
        showMessage("Password must contain at least 8 characters.", false);
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Passwords do not match!", false);
        return;
      }

      showMessage(
        "Frontend validation successful! Backend registration is not connected.",
        true
      );
    });

    function showMessage(text, success) {
      message.textContent = text;
      message.style.color = success ? "#4ade80" : "#f87171";
    }
  </script>

</body>
</html>
