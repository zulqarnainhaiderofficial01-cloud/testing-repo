
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | NexaCore</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1120;
      color: #fff;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: #151e30;
      border: 1px solid #26334a;
      border-radius: 18px;
      box-shadow: 0 20px 60px #0005;
    }

    .logo {
      font-size: 25px;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 35px;
    }

    .icon {
      width: 65px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3b82f620;
      border: 1px solid #3b82f640;
      border-radius: 15px;
      font-size: 30px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 9px;
      color: white;
      outline: none;
      font-size: 14px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px #60a5fa20;
    }

    .reset-btn {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .reset-btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .message {
      display: none;
      padding: 13px;
      margin-top: 18px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .success {
      display: block;
      color: #4ade80;
      background: #14532d30;
      border: 1px solid #166534;
    }

    .error {
      display: block;
      color: #f87171;
      background: #7f1d1d30;
      border: 1px solid #991b1b;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 28px;
      color: #94a3b8;
      font-size: 14px;
      text-decoration: none;
    }

    .back-link span {
      color: #60a5fa;
      font-weight: 600;
    }

    .back-link:hover {
      color: white;
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">NexaCore.</div>

    <div class="icon">🔒</div>

    <h1>Forgot password?</h1>

    <p class="subtitle">
      No worries! Enter the email address associated
      with your account and we'll send you a password
      reset link.
    </p>

    <form id="forgotForm">

      <div class="form-group">
        <label for="email">Email address</label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >
      </div>

      <button type="submit" class="reset-btn">
        Send Reset Link
      </button>

      <div class="message" id="message"></div>

    </form>

    <a href="login.html" class="back-link">
      ← <span>Back to login</span>
    </a>

  </div>

  <script>
    const forgotForm = document.getElementById("forgotForm");
    const message = document.getElementById("message");

    forgotForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMessage("Please enter your email address.", false);
        return;
      }

      showMessage(
        "Frontend demo only. Connect your backend to send a password reset email.",
        true
      );
    });

    function showMessage(text, success) {
      message.textContent = text;
      message.className = "message " + (success ? "success" : "error");
    }
  </script>

</body>
</html>
